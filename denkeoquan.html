<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Đèn kéo quân</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #222, #000);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    perspective: 1200px;
}

.container {
    width: 220px;
    height: 220px;
    position: relative;
    margin-bottom: 20px;
}

.cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
    animation: spin 8s linear infinite;
}

.container:hover .cube {
    animation-play-state: paused;
}

.face {
    position: absolute;
    width: 220px;
    height: 220px;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
    overflow: hidden;
}

.face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.front  { transform: rotateY(0deg) translateZ(110px); }
.back   { transform: rotateY(180deg) translateZ(110px); }
.right  { transform: rotateY(90deg) translateZ(110px); }
.left   { transform: rotateY(-90deg) translateZ(110px); }
.top    { transform: rotateX(90deg) translateZ(110px); }
.bottom { transform: rotateX(-90deg) translateZ(110px); }

@keyframes spin {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}

.controls {
    /* căn giữa và tạo khoảng cách */
    margin-top: 10px;
}

.controls button {
    background: orange;
    border: none;
    padding: 10px 25px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    color: black;
    transition: background-color 0.3s ease;
}

.controls button:hover {
    background: gold;
}

a {
    text-decoration: none;
}
</style>
</head>
<body>

<h2>🏮 Đèn kéo quân</h2>

<div class="container">
    <div class="cube" id="cube">
        <div class="face front"><img src="images/anh1.jpg" alt="Mặt trước"></div>
        <div class="face back"><img src="images/anh2.jpg" alt="Mặt sau"></div>
        <div class="face right"><img src="images/anh3.jpg" alt="Mặt phải"></div>
        <div class="face left"><img src="images/anh4.jpg" alt="Mặt trái"></div>
        <div class="face top"><img src="images/anh5.jpg" alt="Mặt trên"></div>
        <div class="face bottom"><img src="images/anh6.jpg" alt="Mặt dưới"></div>
    </div>
</div>

<div class="controls">
  <a href="index.html">
    <button>⬅ Quay lại Trang Chủ</button>
  </a>
</div>

</body>
</html>
